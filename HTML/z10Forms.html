<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>

<body>
    <h1>Forms</h1>
    <div>
        <form action="welcomePage.html">
            <fieldset>
                <legend>Basic Information</legend>
                <label for="fullName">Full Name: </label>
                <input type="text" id="fullName" placeholder="Enter your name" required>

                <br> <br>
                <label for="email">Email: </label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <br> <br>
                <label for="pass">Password: </label>
                <input type="password" id="pass" placeholder="Enter your password" required>

                <br> <br>
                <label for="check">Are you 18+ ?</label>
                <input type="checkbox" id="check" required>

                <br> <br>
                <label for="phoneNum">Enter your Mobile Num: </label>
                <input type="number" id="phoneNum" required min="0">

                <br> <br>
                <label for="male">Gender: </label>
                <label for="male">Male</label>
                <input type="radio" id="male" name="gender" required>
                <label for="female">Female</label>
                <input type="radio" id="female" name="gender" required>

                <br> <br>
                <label for="dob">Enter your DOB: </label>
                <input type="date" id="dob" required>

                <br> <br>
                <label for="pic">Upload your photo: </label>
                <input type="file" id="pic" required>
                <br> <br>

                <label for="city">Select your city: </label>
                <select name="city" id="city">
                    <option value="">Delhi</option>
                    <option value="">Mumbai</option>
                    <option value="">Patna</option>
                    <option value="">Banglore</option>
                    <option value="">Pune</option>
                    <option value="">Kolkata</option>
                </select>
                <br><br>

                <button type="submit">Submit</button>
            </fieldset>
        </form>
    </div>
</body>

</html>
