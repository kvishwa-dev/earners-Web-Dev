<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <style>
        table, tr, td, th{
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <div>
        <h1>Tables</h1>

        <table>
            <tr>
                <td>1</td>
                <td>2</td>
            </tr>
            <tr>
                <td>3</td>
                <td>4</td>
            </tr>
            <tr>
                <td>5</td>
                <td>6</td>
            </tr>
        </table>

    </div>
    <div>
        <h2>Student Scores Table</h2>

        <table>
            <thead>
            <tr>
                <th>Student/Subject</th>
                <th>Maths</th>
                <th>Hindi</th>
                <th>English</th>
                <th>Science</th>
            </tr>
            </thead>

            <tbody>
            <tr>
                <td>Anu</td>
                <td>50</td>
                <td>90</td>
                <td>75</td>
                <td>80</td>
            </tr>
            <tr>
                <td>Sumit</td>
                <td>67</td>
                <td>65</td>
                <td>75</td>
                <td>78</td>
            </tr>
            <tr>
                <td>Kumar</td>
                <td>56</td>
                <td>78</td>
                <td>79</td>
                <td>85</td>
            </tr>
            </tbody>

            <caption>Students Score</caption>
        </table>
    </div>
</body>
</html>
