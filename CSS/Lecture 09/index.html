<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>

    <!-- Internal CSS -->
    <style>
        p,
        h4 {
            color: aquamarine;
        }
    </style>


    <!-- External CSS -->
    <link rel="stylesheet" href="index.css">

</head>

<body>
    <!-- Inline CSS -->
    <h1 style="color: blue;">CSS Lecture 1</h1>

    <p>Hi Vishwajeet K.</p>

    <span>Hello! How are you?</span>

    <h2>Hiii</h2>
    <h2>Hwllow!</h2>

    <ul>
        <li>Apple</li>
        <li>Ball</li>
        <li>Cat</li>
    </ul>

    <!-- Class selector -->
    <h3 class="hello">Hii Arpit!</h3>

    <h4 class="hello">Hii Rupam!</h4>

    <h5 class="hello hello2">Hello Suman!</h5>

    <!-- ID Selector -->
    <p id="vishwa">Hii Vishwajeet!</p>

    <h6 class="specific" id="specificity" style="color: magenta;">Specificity</h6>
</body>

</html>
