<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pete's Pizza Delivery</title>
</head>

<body>
    <div>
        <div style="text-align: center;">
            <h1>Pete's Pizza Delivery</h1>
            <h2>Online Order Form</h2>
            <p>* required fields</p>
        </div>

        <form action="">
            <fieldset>
                <legend>Customer Details</legend>

                <label for="name">*Name: </label>
                <input type="text" id="name" required>

                <br><br>
                <label for="address">*Address: </label>
                <input type="text" id="address" required>
                <br><br>
                <label for="city">*Town/city: </label>
                <input type="text" id="city" required>
                <br><br>
                <label for="postcode">*Postcode: </label>
                <input type="number" id="postcode" min="0" required>
                <br><br>
                <label for="tel">*Tel: </label>
                <input type="number" id="tel" min="0" required>
                <br><br>
                <label for="email">*Email: </label>
                <input type="email" id="email" required>
            </fieldset>


            <fieldset>
                <legend>Topping *</legend>
                <input type="radio" id="mar" name="topping" required>
                <label for="mar">Margherita</label>
                <br>
                <input type="radio" id="four" name="topping" required>
                <label for="four">Four Seasons</label>
                <br>
                <input type="radio" id="meat" name="topping" required>
                <label for="meat">Meat Feast</label>
            </fieldset>

            <fieldset>
                <legend>Size *</legend>
                <input type="radio" id="small" name="size" required>
                <label for="small">Small</label>
                <br>
                <input type="radio" id="medium" name="size" required>
                <label for="medium">Medium</label>
                <br>
                <input type="radio" id="large" name="size" required>
                <label for="large">Large</label>
            </fieldset>

            <fieldset>
                <legend>Extras</legend>
                <input type="checkbox" id="mush">
                <label for="mush">Mushrooms</label>
                <br>
                <input type="checkbox" id="green">
                <label for="green">Green peppers</label>
                <br>
                <input type="checkbox" id="anch">
                <label for="anch">Anchovies</label>
                <br>
                <input type="checkbox" id="cheese">
                <label for="cheese">Extra Cheese</label>
            </fieldset>

            <fieldset>
                <legend>Delivery</legend>
                <label for="time">Preferred delivery time: </label>
                <input type="time">
                <br>

                <label for="delivery">Delivery instructions: </label>
                <br>
                <textarea name="delivery" id="delivery"></textarea>
            </fieldset>
            <br>
            
            <div style="text-align: center;">
                <button type="submit">Submit order</button>
            </div>

        </form>
    </div>
</body>

</html>
